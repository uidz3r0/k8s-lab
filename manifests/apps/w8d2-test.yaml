apiVersion: apps/v1

kind: Deployment

metadata:
  name: demo-app

spec:
  replicas: 3

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: demo

  template:

    metadata:
      labels:
        app: demo

    spec:

      containers:

      - name: nginx

        image: nginx:stable

        ports:
        - containerPort: 80

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:

          httpGet:
            path: /
            port: 80

        livenessProbe:

          httpGet:
            path: /
            port: 80

        startupProbe:

          httpGet:
            path: /
            port: 80
